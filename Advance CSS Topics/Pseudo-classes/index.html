<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* :hover pseudo class */
        #heading:hover {
            color: #fff;
            background-color: #7a52a3;
            font-size: 50px;
            padding: 10px;
            border-radius: 15px;
        }

        .paragraph:hover {
            border: 2px solid #a3a3a3;
            padding: 30px;
            border-radius: 15px;
            background-color: #f7f7f7;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        /* Focus pseudo class */
        input {
            height: 50px;
            width: 400px;
            font-size: 40px;
            padding: 5px 10px;
            border: 2px solid #ccc;
            border-radius: 8px;
        }

        input:focus {
            background-color: #dbefff;
            border-color: #7a52a3;
        }
    </style>
</head>

<body>
    <h1 id="heading">This is heading</h1>
    <p class="paragraph">Lorem ipsum dolor sit amet consectetur adipisicing elit. Natus autem, voluptate impedit quis
        debitis nemo eum repellat minus deleniti laboriosam temporibus eius neque minima eligendi nam asperiores illum
        odit eveniet.</p>
    <input type="text">
</body>

</html>
