<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <style>
        /* :hover pseudo class */
        #heading:hover {
            color: brown;
            background-color: yellowgreen;
            font-size: 50px;
        }

        .paragraph:hover {
            border: 3px solid red;
            border-radius: 20px;
            padding: 40px;
        }

        /* :focus pseudo class */
        input {
            height: 50px;
            width: 400px;
            font-size: 40px;
        }

        input:focus {
            background-color: aquamarine;
        }
    </style>
</head>

<body>
    <h1 id="heading">This is heading</h1>
    <p class="paragraph">Lorem ipsum dolor sit amet consectetur adipisicing elit. Natus autem, voluptate impedit quis
        debitis nemo eum repellat minus deleniti laboriosam temporibus eius neque minima eligendi nam asperiores illum
        odit eveniet.</p>
    <input type="text">
</body>

</html>
