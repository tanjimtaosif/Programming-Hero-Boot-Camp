<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
    <style>
        .container {
            display: flex;
            justify-content: end;
            gap: 20px;
            border: 2px rgb(20, 157, 175) solid;
            padding: 5px;
            max-width: 100%;
        }

        .box {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            font-family: sans-serif;
        }

        .box1 {
            background-image: linear-gradient(135deg, #ff7e5f, #feb47b);
        }

        .box2 {
            background-image: linear-gradient(135deg, #6a11cb, #2575fc);
        }

        .box3 {
            background-image: linear-gradient(135deg, #11998e, #38ef7d);
        }

        .box4 {
            background-image: linear-gradient(135deg, #fc5c7d, #6a82fb);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>
        <div class="box box4">Box 4</div>
    </div>
</body>

</html>

</html>
