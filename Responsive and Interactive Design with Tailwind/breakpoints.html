<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Breakpoints</title>
</head>

<body>
    <!-- sm:bg-blue-500  ≥640px (Small devices like phones in landscape) -->
    <!-- md:bg-slate-700  ≥768px (Medium devices like tablets) -->
    <!-- lg:bg-green-600  ≥1024px (Large devices like laptops) -->
    <!--xl:bg-fuchsia-500  ≥1280px (Extra large devices like desktops) -->
    <div class="w-100 h-100 bg-red-500 sm:bg-blue-500 md:bg-slate-700 lg:bg-green-600 xl:bg-fuchsia-500">

    </div>
</body>

</html>
